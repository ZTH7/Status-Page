name: Verify and deploy

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy Status Page to production after verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify application
        run: npm run check

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      STATUS_SITE_CONFIG_JSON: ${{ secrets.STATUS_SITE_CONFIG_JSON }}
      STATUS_MONITORS_CONFIG_JSON: ${{ secrets.STATUS_MONITORS_CONFIG_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require private deployment configuration
        shell: bash
        run: |
          if [[ -z "$STATUS_SITE_CONFIG_JSON" || -z "$STATUS_MONITORS_CONFIG_JSON" ]]; then
            echo "STATUS_SITE_CONFIG_JSON and STATUS_MONITORS_CONFIG_JSON are required."
            exit 1
          fi
      - name: Build with private configuration
        run: npm run build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            deploy
            d1 execute DB --remote --file database/schema.sql --yes
